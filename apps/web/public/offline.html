<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0a">
<title>Offline · llm</title>
<link rel="icon" href="/pwa/icon-192.png" type="image/png">
<style>
  /* Self-contained: no app CSS can load while offline. Colours = the adult skin. */
  :root { --bg:#0b0b0a; --fg:#eeece8; --muted:#9a958c; --acc:#ff7a1f; --acc-fg:#1a1208; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); }
  body { font:16px/1.5 ui-monospace, Menlo, monospace; display:grid; place-items:center;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); box-sizing:border-box; text-align:center; }
  img { width:96px; height:96px; border-radius:22px; display:block; margin:0 auto 20px; }
  h1 { font-size:22px; margin:0 0 6px; }
  p { color:var(--muted); margin:0 auto 24px; max-width:32ch; }
  button { min-height:48px; padding:0 22px; border:0; border-radius:12px; background:var(--acc); color:var(--acc-fg); font:600 16px/1 inherit; cursor:pointer; }
</style>
</head>
<body>
  <main>
    <img src="/pwa/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>This page needs a connection. It will load as soon as you are back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
